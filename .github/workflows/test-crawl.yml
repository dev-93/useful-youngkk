name: LH 접속 진단 (읽기 전용)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install probe dependencies
        run: python -m pip install httpx==0.28.1 beautifulsoup4==4.12.3

      - name: Trace LH TCP, TLS and HTTP requests
        run: python scripts/diagnose_lh.py
